name: 'Deploy'

on:
  push:
    tags:
      - v[0-9]+.*
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: choice
        options:
          - testing
          - production
        default: testing

permissions:
  id-token: write # This is required for assuming AWS role via OIDC.
  contents: read  # This is required for actions/checkout

env:
  # Version tags always deploy to production. Manual runs deploy to the chosen environment.
  DEPLOY_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || inputs.environment }}

jobs:
  deploy:
    name: 'Deploy (${{ github.event_name == ''push'' && ''production'' || inputs.environment }})'
    runs-on: ubuntu-latest

    # Secrets referenced below are resolved from this GitHub Environment, so each environment
    # (production, testing) has its own set of secrets with the same names.
    environment: ${{ github.event_name == 'push' && 'production' || inputs.environment }}

    # Never run two deploys against the same environment (and terraform state) at once.
    concurrency:
      group: deploy-${{ github.event_name == 'push' && 'production' || inputs.environment }}
      cancel-in-progress: false

    # Use the Bash shell regardless of whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Map the GitHub Environment to its terraform workspace and base tfvars file.
    - name: Resolve Environment Config
      run: |
        case "$DEPLOY_ENVIRONMENT" in
          production)
            echo "TF_WORKSPACE=default" >> "$GITHUB_ENV"
            echo "BASE_TFVARS=base.prod.tfvars" >> "$GITHUB_ENV"
            ;;
          testing)
            echo "TF_WORKSPACE=test" >> "$GITHUB_ENV"
            echo "BASE_TFVARS=base.test.tfvars" >> "$GITHUB_ENV"
            ;;
          *)
            echo "Unknown environment: $DEPLOY_ENVIRONMENT" >&2
            exit 1
            ;;
        esac

    - name: "Configure AWS Credentials"
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-west-2
        role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
  
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3.1.1
      with:
        # The wrapper adds extra lines to terraform's stdout, which breaks parsing `terraform output -json`.
        terraform_wrapper: false

    - name: Setup Python
      uses: actions/setup-python@v5.1.0
      with:
        python-version-file: .python-version

    - name: Install Python Packages
      run: pip install -r requirements.txt
  
    # Build files required by terraform
    - name: Build
      run: ./build.py

    # Prime tfvars
    - name: Setup Base Terraform Vars
      working-directory: ./terraform
      run: cp "$BASE_TFVARS" terraform.tfvars

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    # TF_WORKSPACE (set above) selects which workspace's state is used.
    - name: Terraform Init
      working-directory: ./terraform
      run: terraform init

    - name: Terraform Apply
      working-directory: ./terraform
      run: >-
        terraform apply -auto-approve -input=false
        -var telegram_bot_token="${{ secrets.TELEGRAM_BOT_TOKEN }}"
        -var main_chat_id="${{ secrets.MAIN_CHAT_ID }}"
        -var bar_spreadsheet="${{ secrets.BAR_SPREADSHEET }}"
        -var selenium_server_url="${{ secrets.SELENIUM_SERVER_URL }}"
        -var announcement_chat_id="${{ secrets.ANNOUNCEMENT_CHAT_ID }}"

    # Point the Telegram bot at the deployed webhook and register its commands.
    # Reads the needed infrastructure information from terraform.
    - name: Set Webhook
      run: ./set-webhook.py terraform
